<!--
  CCApproval mark — a shield with a check, in the panel's own palette:
  badge blue (#4d9bff → #1f6feb) and the `.ok` green a 自动放行 row is printed in.

  This file is the source of truth. Edit it (Inkscape, Figma, a text editor — it is
  plain SVG) and run `npm run icon` to regenerate the raster siblings in this folder.
  Nothing at runtime depends on that toolchain: the panel serves the committed files.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CCApproval">
  <defs>
    <linearGradient id="badge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#4d9bff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="shield" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="56">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6ff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#badge)"/>
  <path d="M32 8 L51 15.5 L51 31.5 L32 56 L13 31.5 L13 15.5 Z" fill="url(#shield)"/>
  <path d="M20.5 31.5 L28 39 L43.5 24" fill="none" stroke="#1a7f37" stroke-width="6.8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
